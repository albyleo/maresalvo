name: Aggiorna osservatorio

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Pubblica i dati validati su main (commit e push automatici)'
        type: boolean
        default: false
  schedule:
    # Weekly, Monday 05:23 UTC. Disabled until the repository variable is enabled.
    - cron: '23 5 * * 1'

concurrency:
  group: observatory-sync-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || vars.OBSERVATORY_AUTO_SYNC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/observatory-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Installa dipendenze degli importatori e dei test
        run: |
          python -m pip install -r scripts/observatory-requirements.txt
          npm ci --ignore-scripts
      - name: Verifica gli importatori
        run: python -B -m unittest discover -s scripts -p test_observatory_import.py
      - name: Scarica e valida le fonti ufficiali
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output
          python -u -B scripts/sync-observatory.py 2>&1 | tee output/observatory-sync.log
      - name: Verifica le raccolte prodotte
        run: npm run test:observatory
      - name: Evidenzia le fonti non aggiornate
        shell: bash
        run: |
          if grep -q 'ATTENZIONE:' output/observatory-sync.log; then
            echo '::warning title=Aggiornamento parziale::Alcune fonti conservano i dati precedenti. Consultare il riepilogo e il log.'
            echo '### Fonti conservate o da revisionare' >> "$GITHUB_STEP_SUMMARY"
            grep 'ATTENZIONE:' output/observatory-sync.log >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Conserva log della sincronizzazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatory-sync-log
          path: output/observatory-sync.log
          if-no-files-found: ignore
          retention-days: 30
      - name: Conserva i dati validati per revisione
        uses: actions/upload-artifact@v4
        with:
          name: observatory-validated-data
          path: public/data/observatory/*.json
          retention-days: 30
      - name: Pubblica solo i file dati
        id: publish
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'schedule' && vars.OBSERVATORY_AUTO_PUBLISH == 'true')
        shell: bash
        run: |
          git add -- public/data/observatory/*.json
          if git diff --cached --quiet; then
            echo 'Nessuna modifica ai dati.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: aggiorna osservatorio da fonti ufficiali'
          # A concurrent change to main rejects this push. Never force or overwrite it.
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Richiedi deploy Vercel tramite hook opzionale
        if: steps.publish.outputs.published == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.OBSERVATORY_VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --max-time 30 --request POST "$DEPLOY_HOOK" --output /dev/null
            echo 'Deploy Vercel richiesto; controllare il suo esito su Vercel.'
          else
            echo 'Nessun hook configurato: verificare il deploy tramite integrazione Git Vercel.'
          fi
      - name: Riepilogo esito
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        shell: bash
        run: |
          echo "Esito sincronizzazione: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "Dati pubblicati su main: ${PUBLISHED:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo 'Il log identifica fonti aggiornate, dati conservati e revisioni richieste. Un download riuscito non implica una nuova campagna.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Il deploy è separato: verificare lo stato su Vercel.' >> "$GITHUB_STEP_SUMMARY"
